<body>
<header class="site-header"><div class="wrap nav">
    <a href="./index.html" aria-label="kilio — home">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="./assets/brand/lockup-dark.svg">
        <img class="brand-mark" src="./assets/brand/lockup-light.svg" alt="kilio">

    <div class="nav-spacer"></div>
    <nav class="nav-links">

    </nav>
    <a class="vulos-home" href="https://vulos.org" target="_blank" rel="noopener" title="Vulos — open, self-hostable software" aria-label="Vulos — open, self-hostable software"><img src="./assets/vulos-logo.png" alt="" width="22" height="22"></a>
  </div></header>
<div class="wrap docs-shell">
  <aside class="docs-nav">
    <div class="label">kilio docs</div>
        <a data-slug="overview" href="#overview">Overview</a>
        <a data-slug="getting-started" href="#getting-started">Getting started</a>
        <a data-slug="self-hosting" href="#self-hosting">Self-hosting</a>
        <a data-slug="security" href="#security">Security model</a>
        <a data-slug="configuration" href="#configuration">Configuration</a>
  </aside>
  <main class="docs-main">
    <div class="docs-title" id="crumb"></div>
    <article class="markdown" id="content">Loading…</article>
  </main>
</div>
<script>
// The site is served statically; docs render straight from this repo's own markdown.
const DOCS = [
  {"slug":"overview","title":"Overview","path":"./docs/overview.md"},
  {"slug":"getting-started","title":"Getting started","path":"./docs/getting-started.md"},
  {"slug":"self-hosting","title":"Self-hosting","path":"./docs/self-hosting.md"},
  {"slug":"security","title":"Security model","path":"./docs/security.md"},
  {"slug":"configuration","title":"Configuration","path":"./docs/configuration.md"}
];
const bySlug = Object.fromEntries(DOCS.map(d=>[d.slug,d]));
const byFile = Object.fromEntries(DOCS.map(d=>[d.path.split('/').pop().toLowerCase(),d]));
const content = document.getElementById('content');
const crumb = document.getElementById('crumb');
let mermaidReady = false;
// 'base' + explicit vars so a diagram reads correctly on kilio's warm paper
// theme (light or dark) instead of assuming a dark app background.
try {
  mermaid.initialize({
    startOnLoad: false, theme: 'base', securityLevel: 'loose',
    themeVariables: {
      fontFamily: 'Hanken Grotesk Variable, ui-sans-serif, system-ui, sans-serif',
      primaryColor: 'transparent', primaryBorderColor: '#5B4BD6', primaryTextColor: '#1B1A22',
      lineColor: '#98959F', secondaryColor: 'transparent', tertiaryColor: 'transparent',
    },
  });
  mermaidReady = true;
} catch(e){}

if (window.marked && marked.setOptions) marked.setOptions({ gfm:true, breaks:false });

function setActive(slug){
  document.querySelectorAll('.docs-nav a').forEach(a=>a.classList.toggle('active', a.dataset.slug===slug));
}

async function renderMermaid(){
  if(!mermaidReady) return;
  const blocks = [...content.querySelectorAll('code.language-mermaid')];
  blocks.forEach((code,i)=>{
    const div = document.createElement('div');
    div.className='mermaid';
    div.textContent = code.textContent;
    code.closest('pre').replaceWith(div);
  });
  const nodes = content.querySelectorAll('.mermaid');
  if(nodes.length){ try { await mermaid.run({ nodes }); } catch(e){ console.warn('mermaid', e); } }
}

async function load(slug){
  const doc = bySlug[slug] || DOCS[0];
  setActive(doc.slug);
  crumb.textContent = doc.title;
  content.innerHTML = 'Loading…';
  try {
    const res = await fetch(doc.path, {cache:'no-cache'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const md = await res.text();
    content.innerHTML = marked.parse(md);
    // Wide tables scroll inside their own box rather than forcing the whole
    // page wider than the viewport (a real overflow bug on narrow phones —
    // table columns don't shrink below their content's natural width).
    content.querySelectorAll('table').forEach(t=>{
      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    content.querySelectorAll('img').forEach(img=>{
      const s=img.getAttribute('src')||'';
      if(/^https?:/i.test(s)) return;
      const m=s.match(/(?:\.\.\/)*(?:docs\/)?screenshots\/(.+)$/);
      if(m) img.setAttribute('src','./screenshots/'+m[1]);
    });
    // Cross-doc links (e.g. decisions.md, docs/SECURITY.md#threat-model) become sidebar navigation.
    content.querySelectorAll('a[href]').forEach(a=>{
      const h=a.getAttribute('href')||'';
      if(/^(https?:|#|mailto:)/i.test(h)) return;
      const m=h.match(/([^\/]+\.md)(#.*)?$/i);
      const target = m && byFile[m[1].toLowerCase()];
      if(target) a.setAttribute('href','#'+target.slug);
    });
    content.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener';});
    await renderMermaid();
    window.scrollTo({top:0});
  } catch(err){
    content.innerHTML = '<div class="docs-error">Could not load <code>'+doc.path.split('/').pop()+'</code> — '+err.message+'</div>';
  }
}

function current(){ return (location.hash||'').replace('#','') || DOCS[0].slug; }
window.addEventListener('hashchange', ()=>load(current()));
load(current());
</script>
</body>
</html>
