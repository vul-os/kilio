name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, build, test gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup target add wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (native)
        run: cargo build --workspace --locked

      # kilio-seal must keep compiling to wasm32: the reporter's browser runs
      # this exact crate, so a native-only dependency creeping in is a break.
      - name: Build (wasm32, kilio-seal)
        run: cargo build -p kilio-seal --target wasm32-unknown-unknown --locked

      # Runs the suite AND asserts it actually executed — see the script header.
      - name: Test gate
        run: ./scripts/test-gate.sh

  web:
    name: web (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # `npm run lint` exiting 0 is not evidence the type-aware rules ran at
      # all — that is exactly how 12 of 13 sibling repos briefly enforced
      # nothing while reporting full coverage. This gate runs the tools
      # against a fixture with a genuine floating promise and asserts the
      # type-aware rule actually fires, checks typescript is pinned exactly,
      # and asserts a real file-coverage floor.
      - name: Lint config gate (type-awareness, TS pin, coverage floor)
        run: npm run check:lint-config

      - run: npm run build

      # The reporter page must fetch nothing from a third party — see the
      # script header for exactly what is and is not asserted.
      - name: No third-party assets in the bundle
        run: ../scripts/web-assets-gate.sh
